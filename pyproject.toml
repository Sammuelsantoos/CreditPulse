[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov=api --cov-report=term-missing"
